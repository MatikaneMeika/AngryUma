<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>愤怒的马娘 · Angry Uma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#8fd9f7;user-select:none;-webkit-user-select:none;touch-action:none}
body{font-family:'ZCOOL KuaiLe','Luckiest Guy',sans-serif}
#cv{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}
.hidden{display:none!important}
/* ---------- 通用 ---------- */
button{font-family:inherit;cursor:pointer;border:none;background:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.iconbtn{pointer-events:auto;width:52px;height:52px;border-radius:14px;background:#fff6e0;border:3px solid #8a5a2a;box-shadow:0 4px 0 #6d4419,inset 0 -4px 0 rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;transition:transform .08s}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #6d4419}
.iconbtn svg{width:26px;height:26px;fill:#8a5a2a}
.iconbtn.bigicon{width:72px;height:72px;border-radius:20px}
.iconbtn.bigicon svg{width:38px;height:38px}
.bigbtn{pointer-events:auto;padding:14px 44px;font-size:26px;color:#fff;background:#67b544;border:3px solid #3c7a25;border-radius:16px;box-shadow:0 6px 0 #2c5a19,inset 0 -6px 0 rgba(0,0,0,.14);letter-spacing:.12em;text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .08s}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #2c5a19,inset 0 -2px 0 rgba(0,0,0,.14)}
.bigbtn.amber{background:#f0a04b;border-color:#b06e1d;box-shadow:0 6px 0 #8a5515,inset 0 -6px 0 rgba(0,0,0,.14)}
.bigbtn.amber:active{box-shadow:0 2px 0 #8a5515}
.bigbtn.grey{background:#9b9484;border-color:#6d675a;box-shadow:0 6px 0 #565142,inset 0 -6px 0 rgba(0,0,0,.14)}
.bigbtn.grey:active{box-shadow:0 2px 0 #565142}
/* ---------- 主菜单 ---------- */
#menu{justify-content:flex-start;padding-top:9vh}
#logo{font-family:'Luckiest Guy',cursive;font-size:min(13vw,92px);line-height:.95;color:#e23b2c;-webkit-text-stroke:3px #7a1408;text-shadow:0 5px 0 #7a1408,0 10px 22px rgba(0,0,0,.25);transform:rotate(-3deg);animation:logob 2.6s ease-in-out infinite;text-align:center}
#logo i{display:block;font-family:'ZCOOL KuaiLe';font-style:normal;font-size:.34em;color:#fff;-webkit-text-stroke:0;text-shadow:0 3px 0 rgba(0,0,0,.35);letter-spacing:.5em;margin-left:.5em}
@keyframes logob{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(-3deg) translateY(-12px)}}
#bPlay{margin-top:7vh;font-size:30px;padding:16px 58px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#bSoundMenu{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px}
#menuFoot{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));color:#4a3a20;font-size:17px;letter-spacing:.2em;text-shadow:0 1px 0 rgba(255,255,255,.6)}
/* ---------- 选关 ---------- */
#select{justify-content:flex-start;padding:calc(12px + env(safe-area-inset-top)) 14px 20px;overflow-y:auto;pointer-events:auto}
.selHead{display:flex;align-items:center;gap:14px;width:100%;max-width:780px;margin-bottom:16px}
.selHead h2{flex:1;font-size:32px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3);letter-spacing:.15em;font-weight:normal}
.selHead .iconbtn{pointer-events:auto}
.wrow{display:flex;align-items:center;gap:16px;background:rgba(255,252,240,.94);border:3px solid #8a5a2a;border-radius:20px;padding:14px 18px;box-shadow:0 5px 0 rgba(0,0,0,.18);max-width:780px;width:100%;margin:0 auto 16px}
.wrow.w0{border-left:12px solid #6fbf44}.wrow.w1{border-left:12px solid #f0a04b}.wrow.w2{border-left:12px solid #4a5a9e}.wrow.w3{border-left:12px solid #2ea3bd}
.wbadge{width:78px;height:78px;border-radius:50%;flex:none;border:3px solid #8a5a2a;overflow:hidden;background:#dff3fd}
.wbadge svg{width:100%;height:100%}
.winfo{flex:1;min-width:0}
.winfo b{display:block;font-size:23px;color:#5a3a14;font-weight:normal}
.winfo span{font-size:14px;color:#9a7a4e}
.lvls{display:flex;gap:14px;flex:none}
.lvl{pointer-events:auto;width:76px;display:flex;flex-direction:column;align-items:center;gap:4px}
.lvl .circ{width:66px;height:66px;border-radius:50%;background:#67b544;border:3px solid #3c7a25;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 3px 0 rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:29px;text-shadow:0 2px 0 rgba(0,0,0,.3);transition:transform .08s}
.lvl:not(.locked) .circ:active{transform:translateY(3px)}
.lvl.locked .circ{background:#b9b2a4;border-color:#8a8477;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.lvl.locked .circ svg{width:26px;height:26px;fill:#f2ede0}
.lvl.fresh .circ{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 0 0 0 rgba(255,220,80,.8)}50%{box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 0 0 9px rgba(255,220,80,0)}}
.lvl .st{display:flex;gap:2px}
.lvl .st svg{width:17px;height:17px;fill:#d5cbb2}
.lvl .st svg.on{fill:#ffc93a}
/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
.hudTop{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:center;justify-content:space-between}
#hud .iconbtn{pointer-events:auto}
#scorePill{background:rgba(255,246,224,.95);border:3px solid #8a5a2a;border-radius:26px;padding:6px 20px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
#scorePill svg{width:22px;height:22px;fill:#ffc93a;stroke:#c8860c;stroke-width:1}
#scoreNum{font-size:24px;color:#5a3a14;min-width:70px;text-align:right}
#pigPill{background:rgba(255,246,224,.95);border:3px solid #8a5a2a;border-radius:26px;padding:5px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
#pigPill img{width:24px;height:24px;object-fit:contain;pointer-events:none}
#pigCount{font-size:24px;color:#5a3a14;min-width:24px;text-align:center;transition:color .3s}
#tag{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-size:34px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35);letter-spacing:.2em;opacity:0;white-space:nowrap}
#tag.go{animation:taggo 2.6s ease forwards}
@keyframes taggo{0%{opacity:0;transform:translateX(-50%) translateY(14px)}15%,75%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}
#hint{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(40,30,15,.72);color:#fff;font-size:19px;padding:9px 24px;border-radius:24px;letter-spacing:.1em;opacity:0;transition:opacity .4s;white-space:nowrap;max-width:92vw}
#hint.on{opacity:1}
/* ---------- 面板 ---------- */
.overlay{background:rgba(30,22,10,.45)}
.panel{background:#fff6e0;border:4px solid #8a5a2a;border-radius:24px;padding:26px 34px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:0 10px 0 rgba(0,0,0,.25);max-width:92vw;animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.panel h2{font-size:34px;color:#5a3a14;font-weight:normal;letter-spacing:.1em}
.panel .tip{font-size:17px;color:#9a7a4e;text-align:center;max-width:320px}
.row2{display:flex;gap:14px}
.rowBtns{display:flex;gap:14px;align-items:center}
.rowBtns .bigbtn{font-size:21px;padding:12px 30px}
#starsRow{display:flex;gap:12px;height:74px;align-items:center}
#starsRow svg{width:66px;height:66px;fill:#d8cdb6;transform:scale(0)}
#starsRow svg.on{fill:#ffc93a;stroke:#c8860c;stroke-width:1;animation:starpop .5s cubic-bezier(.34,1.7,.64,1) forwards}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.scoreLine{font-size:22px;color:#5a3a14}
.scoreLine b{font-size:34px;color:#e2930f;margin-left:8px}
#bonusLine{font-size:17px;color:#9a7a4e;opacity:0;transition:opacity .5s}
#bonusLine.on{opacity:1}
#allDone{display:flex;align-items:center;gap:8px;background:#fdf0cf;border:2px dashed #d8a94e;border-radius:14px;padding:8px 18px;color:#b06e1d;font-size:18px}
#allDone svg{width:24px;height:24px;fill:#ffc93a;stroke:#c8860c;stroke-width:1}
#losePig{width:120px;height:100px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#losePig img{width:280px;max-width:none;transform:translateY(2px);pointer-events:none}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#5a3a14;font-size:20px;background:#fff6e0;text-align:center;padding:30px}
/* ---------- 道具栏（注册表驱动，REG.items 为空时保持 hidden） ---------- */
#itemBar{position:absolute;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:10px;pointer-events:none}
.itemBtn{pointer-events:auto;position:relative;width:56px;height:56px;border-radius:14px;background:#fff6e0;border:3px solid #8a5a2a;box-shadow:0 3px 0 #6d4419,inset 0 -4px 0 rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:26px;transition:transform .08s}
.itemBtn:active{transform:translateY(2px)}
.itemBtn.armed{background:#ffe9a8;border-color:#c8860c;box-shadow:0 0 0 3px rgba(255,201,58,.55),0 3px 0 #8a5515}
.itemBtn[disabled]{opacity:.45;pointer-events:none}
.itemBtn .cnt{position:absolute;right:-7px;top:-7px;min-width:20px;height:20px;border-radius:10px;background:#e23b2c;color:#fff;font-size:13px;line-height:20px;text-align:center;padding:0 5px;border:2px solid #fff6e0}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">
  <!-- 游戏内 HUD -->
  <div id="hud" class="hidden">
    <div class="hudTop">
      <button class="iconbtn" id="bPause" title="暂停"></button>
      <div id="scorePill"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.6-5.2 4.6 1.5 6.8-6.1-3.6-6.1 3.6 1.5-6.8L2.2 8.9l6.9-.6z"/></svg><span id="scoreNum">0</span></div>
      <div id="pigPill"><img src="media/pigs/pig_normal.png" alt="奇宝"><span id="pigCount">0</span></div>
      <button class="iconbtn" id="bRetry" title="重玩"></button>
    </div>
    <div id="tag"></div>
    <div id="hint"></div>
    <div id="itemBar" class="hidden"></div>
  </div>
  <!-- 主菜单 -->
  <div id="menu" class="screen">
    <div id="logo">ANGRY UMA<i>愤怒的马娘</i></div>
    <button class="bigbtn" id="bPlay">开 始 游 戏</button>
    <button class="iconbtn" id="bSoundMenu"></button>
    <div id="menuFoot">四个世界 · 十六个关卡 · 四位马娘</div>
  </div>
  <!-- 选关 -->
  <div id="select" class="screen hidden">
    <div class="selHead"><button class="iconbtn" id="bBackMenu"></button><h2>选择关卡</h2></div>
    <div id="worldList"></div>
  </div>
  <!-- 暂停 -->
  <div id="pause" class="screen overlay hidden">
    <div class="panel">
      <h2>暂停</h2>
      <button class="bigbtn" id="bResume" style="width:240px">继续游戏</button>
      <div class="row2">
        <button class="bigbtn amber" id="bRetryP">重新开始</button>
        <button class="bigbtn grey" id="bSelectP">选择关卡</button>
      </div>
      <button class="iconbtn bigicon" id="bSoundP"></button>
    </div>
  </div>
  <!-- 胜利 -->
  <div id="win" class="screen overlay hidden">
    <div class="panel">
      <h2>关卡通过！</h2>
      <div id="starsRow">
        <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.6-5.2 4.6 1.5 6.8-6.1-3.6-6.1 3.6 1.5-6.8L2.2 8.9l6.9-.6z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.6-5.2 4.6 1.5 6.8-6.1-3.6-6.1 3.6 1.5-6.8L2.2 8.9l6.9-.6z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.6-5.2 4.6 1.5 6.8-6.1-3.6-6.1 3.6 1.5-6.8L2.2 8.9l6.9-.6z"/></svg>
      </div>
      <div class="scoreLine">得分<b id="winScore">0</b></div>
      <div id="bonusLine"></div>
      <div id="allDone" class="hidden"></div>
      <div class="rowBtns">
        <button class="iconbtn bigicon" id="bWinMenu"></button>
        <button class="iconbtn bigicon" id="bWinRetry"></button>
        <button class="bigbtn" id="bNext">下一关</button>
      </div>
    </div>
  </div>
  <!-- 失败 -->
  <div id="lose" class="screen overlay hidden">
    <div class="panel">
      <div id="losePig">
        <img src="media/pigs/King_normal.png" alt="奇宝猪">
      </div>
      <h2>哎呀，失败了！</h2>
      <p class="tip" id="loseTip"></p>
      <div class="rowBtns">
        <button class="iconbtn bigicon" id="bLoseMenu"></button>
        <button class="bigbtn" id="bLoseRetry">再试一次</button>
      </div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="src/00-boot.js"></script>
<script src="src/10-registry.js"></script>
<script src="src/20-data.js"></script>
<script src="src/21-levels-w2w3.js"></script>
<script src="src/feat-carrot.js"></script>
<script src="src/feat-zones.js"></script>
<script src="src/level-zones.js"></script>
<script src="src/feat-contraptions.js"></script>
<script src="src/level-contraptions.js"></script>
<script src="src/feat-items-uma.js"></script>
<script src="src/feat-items-time.js"></script>
<script src="src/30-engine.js"></script>
<script src="src/40-render.js"></script>
<script src="src/50-ui-input.js"></script>
</body>
</html>
